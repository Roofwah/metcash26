<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DBLE — Energizer Sales Activation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="dble_logo.svg" alt="DBLE" class="logo" />
      <p class="tagline">
        <span class="tagline-line">Better Customer Conversations</span>
        <span class="tagline-line">Better Sales Outcomes</span>
      </p>
    </header>

    <main class="main" id="main">
      <section id="view-login" class="panel panel-login">
        <h2>Sign in</h2>
        <p class="muted">Energizer sales team — one login for all channels.</p>
        <div id="login-error" class="login-message login-error hidden" role="alert"></div>
        <div id="login-info" class="login-message login-info hidden"></div>
        <form id="login-form" class="login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@energizer.com" required />
          <div id="otp-block" class="hidden">
            <label for="otp">6-digit code</label>
            <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
            <button type="button" id="btn-resend" class="btn btn-secondary">Resend code</button>
          </div>
          <button type="submit" id="btn-submit" class="btn btn-primary">Send sign-in code</button>
        </form>
      </section>

      <section id="view-hub" class="panel panel-hub hidden">
        <div class="hub-header">
          <div>
            <h2>Select channel</h2>
            <p class="muted">Signed in as <span id="hub-email"></span></p>
          </div>
          <button type="button" id="btn-logout" class="btn btn-secondary btn-sm">Sign out</button>
        </div>
        <div id="channel-grid" class="channel-grid"></div>
        <p class="note" id="hub-footer"></p>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
